# Utilmo AI on your own server: app + PostgreSQL (pgvector) + Caddy (automatic HTTPS).
# 1) cp .env.selfhost.example .env and fill it   2) docker compose up -d --build
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: utilmo
      POSTGRES_USER: utilmo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U utilmo"], interval: 5s, retries: 20 }
  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://utilmo:${POSTGRES_PASSWORD}@db:5432/utilmo
      PORT: "8080"
      TRUST_PROXY: "true"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment: { APP_DOMAIN: "${APP_DOMAIN:?set APP_DOMAIN in .env}" }
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data]
volumes: { db-data: {}, caddy-data: {} }
